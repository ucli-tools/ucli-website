name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main, plain]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ucli-kit
        continue-on-error: true   # a kit check never blocks a deploy
        run: bash scripts/check-kit.sh

      - name: Check tokens (every var(--u-...) in src/ exists in the kit)
        run: bash scripts/check-tokens.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check chrome (top bar and footer against ucli-kit/sites.txt)
        continue-on-error: true   # a chrome check never blocks a deploy
        run: bash scripts/check-chrome.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
